[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvstream"
dynamic = ["version"]
description = "An OpenAI-compatible admission-control gateway (middleware) for Microsoft Foundry Local."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "KVStream Contributors" }]
keywords = ["foundry-local", "llm", "inference", "gateway", "admission-control", "proxy", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Required by FastAPI to parse the multipart bodies that
    # /v1/audio/transcriptions is built on.
    "python-multipart>=0.0.9",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
kvstream = "kvstream.cli:app"

[project.urls]
Homepage = "https://github.com/microsoft/KVstream"
Repository = "https://github.com/microsoft/KVstream"
Issues = "https://github.com/microsoft/KVstream/issues"

[tool.hatch.version]
path = "src/kvstream/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kvstream"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
packages = ["kvstream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
