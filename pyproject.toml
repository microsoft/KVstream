[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvstream"
version = "0.1.0"
description = "PagedAttention + continuous batching as a drop-in plugin for local LLM inference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "KVStream Contributors" }]
keywords = ["llm", "inference", "paged-attention", "ollama", "kv-cache", "on-premise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "aiofiles>=24.1.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
# GPU tensor pool for hard KV inject (llama.cpp). The proxy, scheduler and
# prefix cache work without torch — install this extra only if you need it.
gpu = ["torch>=2.5.0", "numpy>=1.26.0"]
flash = ["flash-attn>=2.7.0"]
xformers = ["xformers>=0.0.28"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
kvstream = "kvstream.cli.main:app"

[project.urls]
Homepage = "https://github.com/microsoft/kvstream"
Repository = "https://github.com/microsoft/kvstream"
Issues = "https://github.com/microsoft/kvstream/issues"

[tool.hatch.build.targets.wheel]
packages = ["kvstream"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
