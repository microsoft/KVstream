# KVStream configuration
# -----------------------------------------------------------------------
# Tip: every field can also be set via environment variable using the
# KVSTREAM_ prefix and __ for nesting, e.g.:
#   KVSTREAM_BACKEND__TYPE=foundry
#   KVSTREAM_MEMORY__NUM_GPU_BLOCKS=512
# -----------------------------------------------------------------------

backend:
  type: foundry                                    # ollama | foundry | llamacpp | lmstudio
  base_url: http://localhost:5274                  # Foundry SDK service port (auto-discovered if wrong)
  model: qwen2.5-0.5b-instruct-generic-cpu        # model ID returned by /v1/models
  timeout_seconds: 120.0
  kv_inject_enabled: true
  kv_cache_dir: /tmp/kvstream_kv_cache

memory:
  # -----------------------------------------------------------------------
  # GPU block budget — tune this to your VRAM.
  #
  # Each block ≈ block_size × 2(K+V) × num_layers × num_heads × head_dim × dtype_bytes
  # For phi-3-mini (32 layers, 32 heads, 128 dim, float16):
  #   1 block = 16 × 2 × 32 × 32 × 128 × 2 = 8,388,608 bytes ≈ 8 MB
  #
  # Safe starting values by VRAM:
  #    4 GB VRAM  →  64 blocks  (  512 MB KV pool)
  #    8 GB VRAM  → 128 blocks  (    1 GB KV pool)
  #   16 GB VRAM  → 256 blocks  (    2 GB KV pool)
  #   24 GB VRAM  → 512 blocks  (    4 GB KV pool)
  #
  # NOTE: For Ollama / Foundry / LM Studio (soft-inject backends) the
  # PagedKVCache tensor pool is NOT allocated — these values only affect
  # the block manager's logical page table (negligible RAM).
  # -----------------------------------------------------------------------
  num_gpu_blocks: 256
  num_cpu_blocks: 512          # CPU swap buffer (pinned RAM on CUDA machines)
  block_size: 16               # tokens per page — must be a power of two
  dtype: float16               # float16 | bfloat16 | float32

scheduler:
  max_batch_size: 8            # max sequences in one forward pass
  max_waiting_tokens: 4096
  preemption_policy: swap      # swap (move pages to CPU) | recompute (drop & redo)
  priority: fcfs               # fcfs (first-come) | sjf (shortest-job-first)
  max_tokens_per_seq: 8192

prefix_cache:
  enabled: true
  max_prefix_length: 2048      # tokens — must be a multiple of block_size
  ttl_seconds: 3600            # how long a prefix entry lives without a hit
  min_match_tokens: 16         # minimum prefix length to bother caching

attention:
  # Only used when backend supports hard KV inject (llamacpp).
  # Must match the model you are running.
  backend: naive               # naive (default) | flash (pip install kvstream[flash]) | xformers
  num_layers: 32
  num_heads: 32
  head_dim: 128

observability:
  metrics_enabled: true
  log_level: INFO              # DEBUG | INFO | WARNING | ERROR
  trace_requests: false        # set true to log every request (verbose)

host: 0.0.0.0
port: 8080
