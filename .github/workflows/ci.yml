name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on any branch from the Actions tab (e.g. before opening a PR).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary Foundry Local platform; macOS (Apple silicon)
        # is the other one Foundry Local supports; Linux covers containers.
        # Port discovery runs a different tool on each (netstat / netstat / ss).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"

    # One shell syntax on every OS (Git Bash on Windows).
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The package lives in src/kvstream (src layout); these steps used to
      # point at a `kvstream/` directory that does not exist, and failed.
      - name: Lint (ruff)
        run: ruff check src/kvstream tests

      - name: Format check (ruff)
        run: ruff format --check src/kvstream tests

      - name: Type check (mypy)
        run: mypy src/kvstream

      - name: Run tests
        run: python -m pytest --cov=kvstream --cov-report=term-missing
